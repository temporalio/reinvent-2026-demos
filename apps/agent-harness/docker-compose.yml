# Runs the same two processes as the catalog deployment, against a Temporal dev server on
# the host: `temporal server start-dev`, then `GEMINI_API_KEY=... docker compose up --build`.

x-app: &app
  build: .
  environment: &env
    TEMPORAL_ADDRESS: host.docker.internal:7233
    TEMPORAL_NAMESPACE: default
    TEMPORAL_TASK_QUEUE: agent-harness
    PAYLOAD_DIR: /payloads
  volumes:
    - payloads:/payloads
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  web:
    <<: *app
    command: ["web"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s

  worker:
    <<: *app
    command: ["worker"]
    environment:
      <<: *env
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Optional: Claude Haiku on Bedrock writes the suggested replies. Without it the page
      # opens with built-in trip ideas and offers no replies after that.
      SUGGEST_MODEL_ID: ${SUGGEST_MODEL_ID:-}
      AWS_REGION: ${AWS_REGION:-us-west-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

volumes:
  payloads:
