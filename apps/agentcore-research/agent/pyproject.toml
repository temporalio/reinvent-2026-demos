[project]
name = "oncall-agent"
version = "0.1.0"
description = "On-call agent Worker for Amazon Bedrock AgentCore"
requires-python = ">=3.14,<3.15"
# Exact pins, checked on PyPI on 2026-11-23; uv.lock pins the rest.
dependencies = [
    "temporalio==1.36.1",
    "temporalio-strands-agents==1.0.0",
    "strands-agents==1.66.0",
    "bedrock-agentcore==1.27.0",
]

[dependency-groups]
test = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
