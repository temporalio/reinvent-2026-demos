<!doctype html>
<!-- Screensaver: the attract loop a portrait kiosk shows between visitors.
     Built from the "0 Screensaver" frame (1080 x 1920) in the REinvent roughs file.

     The screen is a fixed 1080 x 1920 stage laid out in Figma pixels, scaled to fit
     the window and centred. Behind it, the kit's animated starfield fills the whole
     window, the same background as the demo catalog's sign-in page.

     Two logo marquees run edge to edge across the window, 40 Figma pixels in from its
     top and bottom: the top one scrolls right to left, the bottom one left to right.
     They show the customer logos from temporal.io's home page, kept in
     assets/brand/customer-logos/ and listed in LOGOS in the script. The script
     repeats the list until the strip is covered twice over, then the strip slides by
     exactly one copy so the loop never shows a seam.

     The planets represent the Launchpad demos. Each one circles its orbit, growing
     as it swings to the front and shrinking as it passes behind. Tap a planet to open
     its deck's lead demo on the card; DECKS in the script holds that copy and each
     demo's introduction. The card's Launch outline fills over CARD_SECONDS, then the card
     closes and only the orbits stay until the next planet is tapped. A tap anywhere
     else goes on to crew selection, as does every Launch button.

     Point the asset paths at your copy of assets/. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Screensaver</title>
  <meta name="theme-color" content="#141414">
  <link rel="icon" href="../../assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/temporal-theme.css">
  <link rel="stylesheet" href="../../assets/css/temporal-components.css">
  <link rel="stylesheet" href="../../assets/css/cosmic-pop-theme.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    /* Built for a 65" portrait multitouch screen: no pinch zoom, panning, text
       selection, long-press menus or tap flashes, so stray touches change nothing. */
    html {
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    img { -webkit-user-drag: none; }
    body { background: var(--surface-page); }

    /* The stage: every size inside it is in Figma pixels. --s is set by the script. */
    .screensaver {
      position: fixed; left: 50%; top: 50%;
      width: 1080px; height: 1920px;
      transform: translate(-50%, -50%) scale(var(--s, 1));
      overflow: hidden;
    }
    .screensaver > *, .ambient-artboard > * { position: absolute; }
    .stage-art { inset: 0; width: 100%; height: 100%; overflow: visible; }
    .lines { pointer-events: none; }

    /* Background art */
    /* Background fills the viewport even when the portrait artboard is letterboxed. */
    .viewport-glow { position:fixed; inset:0; overflow:hidden; pointer-events:none; }
    .viewport-glow .glow { position:absolute; left:calc(-868px * var(--s, 1)); top:calc(-494.7px * var(--s, 1)); width:calc(1814.85px * var(--s, 1)); height:calc(1355.62px * var(--s, 1)); rotate:-42.34deg; scale:1 -1; }
    .viewport-decor { position:fixed; inset:0; overflow:hidden; pointer-events:none; }
    .ambient-artboard { position:absolute; left:0; top:0; transform:scale(var(--s,1)); transform-origin:0 0; }
    .comet-ring { fill: none; stroke: var(--status-retrying); stroke-width: .5; opacity: .7; }
    .link { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 2 10; }
    /* The big asteroid starts where Figma puts it; the script then arcs it off the bottom. */
    .asteroid { left: 0; top: 0; width: 94.26px; height: 70.88px; transform: translate(1032.5px, 1529.2px) rotate(149.13deg); }
    /* Little asteroids that drift through a corner now and then; the script moves them. */
    .drifter { left: 0; top: 0; height: auto; pointer-events: none; opacity: 0; }

    /* Orbit system. --accent is the selected planet's colour. */
    .screensaver { --accent: var(--persona-captain); }
    .orbits { pointer-events: none; }
    .orbit { fill: none; stroke: var(--text-primary); stroke-opacity: .2; }
    .orbit.current { stroke: var(--accent); stroke-opacity: 1; }
    .mark { fill: var(--text-primary); }
    .planet { pointer-events: auto; cursor: pointer; outline: none; }
    .planet .hit { fill: transparent; stroke: none; }
    .planet:focus-visible .hit { stroke: var(--focus-ring); stroke-width: .05; }
    .planet .halo { fill: none; stroke: currentColor; stroke-width: .037; stroke-dasharray: .037 .184; visibility: hidden; }
    .planet[aria-pressed="true"] .halo { visibility: visible; }

    /* Header */
    .header { left: 90px; top: 160px; width: 890px; color: var(--text-primary); }
    .header-row { display: flex; justify-content: space-between; align-items: center; }
    .header-row .logo { width: 155.19px; height: 30px; }
    .header-row .rule { width: 485.375px; height: 40px; }
    .title {
      display: grid; padding-bottom: 20px; margin: 0;
      font: 400 200px/1 var(--font-mono); letter-spacing: -2px; text-transform: uppercase;
    }
    /* One filled layer under three hollow ones, each nudged a few pixels. */
    .title span { grid-area: 1 / 1; width: 890px; }
    .title .fill { margin: 3px 0 0; }
    .title .outline { color: transparent; -webkit-text-stroke: 1px var(--text-primary); }
    .title .outline:nth-child(3) { margin: 10px 0 0 6px; }
    .title .outline:nth-child(4) { margin: 4px 0 0 12px; }
    .tagline { display: flex; align-items: center; gap: 17.28px; margin: 0; font: 400 40px/1 var(--font-mono); letter-spacing: 2px; text-transform: uppercase; }
    .tagline i { flex: 1; height: 2px; background: var(--text-primary); opacity: .6; }

    /* Demo card, coloured by the selected planet. */
    .card-overview { left: 180px; top: 1378px; width: 720px; }
    .card-overview.is-swapping { animation: card-in .35s cubic-bezier(.2, 1.4, .4, 1); }
    @keyframes card-in { from { opacity: 0; transform: translateY(12px) scale(.97); } }
    .card-row { display: flex; }
    .card {
      flex: 1; display: flex; flex-direction: column; gap: 30px; padding: 30px;
      background: var(--surface-page); border: 2px solid var(--accent); color: var(--text-primary);
      transition: none;
    }
    /* The base theme turns a card's border violet on hover; on a touch kiosk it only flickers. */
    .card:hover { border-color: var(--accent); }
    .card-content { display: flex; flex-direction: column; gap: 10px; }
    .card .badge {
      align-self: flex-start; padding: 5px; border: 2px solid var(--accent); color: var(--accent);
      font: 700 16px/18px var(--font-mono); letter-spacing: 2px; text-transform: uppercase;
    }
    .card h2 { margin: 0; font: 700 50px/1.3 var(--font-mono); letter-spacing: -1px; text-transform: uppercase; }
    .card p { margin: 0; font: 400 24px/32px var(--font-sans); }
    .card .keep { white-space: nowrap; }
    .card mark { padding: 0 5px; background: var(--accent); color: var(--surface-page); font-weight: 700; }
    .card .stop { color: var(--accent); margin-left: 5px; }
    /* Launch is an outline that fills from the left while the card is open; when it is
       full the card closes. The filled copy of the label sits on top, clipped to the
       elapsed time, so the text stays readable over both halves. */
    .card .launch {
      position: relative; display: block; height: 44px; border: 2px solid var(--accent);
      color: var(--accent); text-decoration: none;
      font: 700 18px/24px var(--font-mono); text-transform: uppercase;
    }
    .launch .label { display: flex; justify-content: space-between; align-items: center; height: 100%; padding: 0 18px; }
    .launch .label.filled { position: absolute; inset: 0; background: var(--accent); color: var(--surface-page); clip-path: inset(0 100% 0 0); }
    .launch[aria-disabled="true"] { cursor: default; }
    .card-overview.is-closed { visibility: hidden; }
    .screensaver.is-idle .link { visibility: hidden; }
    .card-edge {
      width: 20px; border: 2px solid var(--accent);
      background: repeating-linear-gradient(30deg, var(--accent) 0 2px, transparent 2px 8px);
    }
    .card-foot { height: 20px; background: var(--accent); }

    /* Logo marquees: 40 Figma pixels in from the window's top and bottom, edge to edge across it. */
    .marquee { position: fixed; left: 0; right: 0; overflow: hidden; height: calc(32px * var(--s, 1)); }
    .marquee.top { top: calc(40px * var(--s, 1)); }
    .marquee.bottom { bottom: calc(40px * var(--s, 1)); }
    .marquee-track { display: flex; width: max-content; height: 100%; }
    .marquee-track.is-running { animation: marquee-left var(--marquee-duration, 30s) linear infinite; }
    .marquee.bottom .marquee-track.is-running { animation-name: marquee-right; }
    .marquee img { display: block; height: 100%; width: auto; margin-right: calc(56px * var(--s, 1)); opacity: .5; flex: none; }
    /* The track holds the logo set twice, so sliding by half of it lands on an identical frame. */
    @keyframes marquee-left  { from { transform: translateX(0); }    to { transform: translateX(-50%); } }
    @keyframes marquee-right { from { transform: translateX(-50%); } to { transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) {
      .marquee-track.is-running, .card-overview.is-swapping { animation: none; }
    }
  </style>
</head>

    // ---------- Stage fit and logo marquees ----------

    // Both marquees move at the same speed, in Figma pixels per second.
    const SPEED = 15;

    // The customer logos from temporal.io's home-page marquee, in its order. The
    // bottom strip starts halfway through the list, so the two strips never show the
    // same logos at once.
    const LOGO_DIR = "../../assets/brand/customer-logos/";
    const LOGOS = [
      "qualtrics.svg", "rea-group.svg", "snap.svg", "macquarie.svg", "anz.png", "openai.svg",
      "yum-brands.svg", "kotak.png", "vodafone.svg", "cloudflare.svg", "gitlab.svg", "remitly.svg",
      "alaska-airlines.png", "bentley-systems.svg", "bestseller.svg", "deloitte.svg", "godaddy.png",
      "doordash.svg", "retool.png", "checkr.svg", "turo.svg", "mollie.svg", "lovable.svg",
      "abridge.svg", "hebbia.svg",
    ];

    const tracks = [...document.querySelectorAll(".marquee-track")];
    const logoImages = LOGOS.map(file => {
      const img = new Image();
      img.src = LOGO_DIR + file;
      img.alt = "";
      return img;
    });
    const half = Math.ceil(LOGOS.length / 2);
    // The logos each marquee repeats, in order, on every fill.
    const sources = new Map([
      [tracks[0], logoImages],
      [tracks[1], [...logoImages.slice(half), ...logoImages.slice(0, half)]],
    ]);
    let scale = 1;
    const ambient = document.querySelector(".ambient-artboard");
    let ambientWidth = 1080, ambientHeight = 1920;

    // Fit the 1080 x 1920 stage inside the window.
    function fit() {
      scale = Math.min(innerWidth / 1080, innerHeight / 1920);
      document.documentElement.style.setProperty("--s", scale);
      ambientWidth = innerWidth / scale; ambientHeight = innerHeight / scale;
      ambient.style.width = `${ambientWidth}px`; ambient.style.height = `${ambientHeight}px`;
    }

    function fill(track) {
      const source = sources.get(track);
      track.classList.remove("is-running");
      track.replaceChildren();
      if (!source.length) return;
      // Repeat the logos until one set covers the strip...
      const strip = track.parentElement.getBoundingClientRect().width;
      do source.forEach(img => track.append(img.cloneNode()));
      while (track.getBoundingClientRect().width < strip);
      const set = track.getBoundingClientRect().width;
      // ...then add a second set for the loop to slide into.
      [...track.children].forEach(img => track.append(img.cloneNode()));
      track.style.setProperty("--marquee-duration", `${set / (SPEED * scale)}s`);
      track.classList.add("is-running");
    }

    function start() {
      fit();
      tracks.forEach(fill);
    }

    fit();
    // Wait for every logo to load so the measured widths are real; a logo that fails
    // to load is left out rather than holding up the strips.
    Promise.allSettled(logoImages.map(img => img.decode())).then(results => {
      results.forEach((r, i) => { if (r.status === "rejected") console.warn("Logo did not load:", LOGOS[i]); });
      for (const [track, list] of sources) sources.set(track, list.filter(img => img.naturalWidth));
      start();
      addEventListener("resize", start);
    });

            "color": "--persona-captain",
            "orbit": 1,
            "angle": 75,
            "r": 28,
            "pace": 1.6,
            "lead": "Shubham’s AgentCore research demo.",
            "mark": "Coming soon",
            "rest": " — a new AI research mission is on its way.",
            "url": "/?screen=crew"
      }
];

    // How far round the front a planet is: 0 at the back of its orbit, 1 at the front.
    const depthAt = deg => (1 + Math.sin(deg * Math.PI / 180)) / 2;
    // Planets shrink to 40% of their front size at the back.
    const sizeAt = depth => .4 + .6 * depth;
    // Seconds per lap: outer orbits are slower, and each planet's pace stretches or
    // shrinks its own lap so no two move at quite the same speed.
    const lapFor = (rx, pace) => 40 * (rx / 180) ** 1.5 * pace;
    // A finger-sized target, in Figma pixels, however small the planet is: on a 65"
    // portrait screen 60px is about 45mm, roomy enough to catch a moving planet.
    const MIN_HIT = 60;

    const planetLayer = document.querySelector(".planets");
    const link = document.querySelector(".link");
    const stage = document.querySelector(".screensaver");
    const card = document.querySelector(".card-overview");

    const planets = DECKS.map(deck => {
      const g = document.createElementNS(SVG, "g");
      g.classList.add("planet");
      g.setAttribute("role", "button");
      g.setAttribute("tabindex", "0");
      g.setAttribute("aria-label", `${deck.deck}: ${deck.title}`);
      g.style.color = `var(${deck.color})`;
      g.innerHTML = `<circle class="hit"/><circle class="halo" r="1.45"/>`
        + (deck.ring ? `<use href="#planet-ring"/>` : "") + `<use href="#planet-body"/>`;
      // Select on touch-down: the planet keeps moving, so waiting for the finger to
      // lift could land the tap on something else. Each touch is its own pointer, so
      // several people can tap at once.
      g.addEventListener("pointerdown", () => select(planet));
      g.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(planet); }
      });
      planetLayer.append(g);
      const planet = { deck, g, hit: g.querySelector(".hit"), front: deck.r / sizeAt(depthAt(deck.angle)), x: 0, y: 0, depth: 0 };
      return planet;
    });

    // How long a card stays open before it closes on its own, in seconds.
    const CARD_SECONDS = 15;

    const launch = card.querySelector(".launch");
    let selected = null;
    let timer = null;
    const previewRotation = window.createPreviewRotation({ count:planets.length, onSelect:index=>select(planets[index]) });
    previewRotation.setHidden(document.hidden);
    document.addEventListener("visibilitychange",()=>previewRotation.setHidden(document.hidden));
    addEventListener("pagehide",()=>previewRotation.stop());

    function select(planet) {
      previewRotation.selected(planets.indexOf(planet));
      selected = planet;
      const { deck } = planet;
      stage.classList.remove("is-idle");
      card.classList.remove("is-closed");
      stage.style.setProperty("--accent", `var(${deck.color})`);
      planets.forEach(p => p.g.setAttribute("aria-pressed", p === planet));
      orbitEls.forEach((el, i) => el.classList.toggle("current", i === deck.orbit));

      card.querySelector(".badge").textContent = deck.badge;
      card.querySelector("h2").textContent = deck.title;
      const p = card.querySelector("p");
      p.replaceChildren(deck.lead ? deck.lead + " " : "");
      const keep = document.createElement("span");
      keep.className = "keep";
      const mark = document.createElement("mark");
      mark.textContent = deck.mark;
      keep.append(mark);
      // A closing full stop takes the accent colour, as in the Figma card.
      if (deck.rest === ".") {
        const stop = document.createElement("span");
        stop.className = "stop";
        stop.textContent = ".";
        keep.append(stop);
        p.append(keep);
      } else {
        p.append(keep, deck.rest);
      }
      launch.setAttribute("aria-label", `Choose your crew to explore ${deck.title}`);
      launch.href = "/?screen=crew";
      launch.removeAttribute("target");
      launch.removeAttribute("aria-disabled");
      card.classList.remove("is-swapping");
      void card.offsetWidth;
      card.classList.add("is-swapping");
      place(planet);

      // Fill the Launch outline over CARD_SECONDS, then close the card. Picking a
      // planet again starts a fresh fill.
      timer?.cancel();
      timer = launch.querySelector(".filled").animate(
        [{ clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0 0 0)" }],
        { duration: CARD_SECONDS * 1000, easing: "linear", fill: "forwards" },
      );
      timer.finished.then(close, () => {});
    }

    // Keep the orbits clear for five seconds, then preview a different planet.
    function close() {
      previewRotation.closed();
      selected = null;
      timer = null;
      planets.forEach(p => p.g.setAttribute("aria-pressed", false));
      orbitEls.forEach(el => el.classList.remove("current"));
      stage.classList.add("is-idle");
      const hide = () => card.classList.add("is-closed");
      if (reduceMotion) return hide();
      card.animate([{ opacity: 1 }, { opacity: 0, transform: "translateY(12px) scale(.97)" }], { duration: 300, easing: "ease-in" })
        .finished.then(() => { if (!selected) hide(); });
    }

    launch.addEventListener("click", event => {
      event.preventDefault();
      window.boothExitScreensaver();
    });

    // Planet/card taps stay interactive. Every exit starts with crew selection.
    addEventListener("pointerdown", e => {
      if (e.target.closest(".planet, .card-overview")) return;
      window.boothExitScreensaver();
    });

    function place(planet) {
      link.setAttribute("x1", planet.x);
      link.setAttribute("y1", planet.y);
    }

    function draw(seconds) {
      for (const planet of planets) {
        const { deck } = planet;
        const [cx, cy, rx, ry] = ORBITS[deck.orbit];
        const deg = deck.angle + 360 * seconds / lapFor(rx, deck.pace);
        const rad = deg * Math.PI / 180;
        planet.x = cx + rx * Math.cos(rad);
        planet.y = cy + ry * Math.sin(rad);
        planet.depth = depthAt(deg);
        const size = planet.front * sizeAt(planet.depth);
        planet.g.setAttribute("transform", `translate(${planet.x.toFixed(2)} ${planet.y.toFixed(2)}) scale(${size.toFixed(3)})`);
        planet.g.setAttribute("opacity", (.65 + .35 * planet.depth).toFixed(3));
        planet.hit.setAttribute("r", Math.max(1.6, MIN_HIT / size).toFixed(3));
      }
      // Draw the planets nearest the front last, so they pass over the ones behind.
      const order = [...planets].sort((a, b) => a.depth - b.depth);
      if (order.some((p, i) => planetLayer.children[i] !== p.g)) planetLayer.append(...order.map(p => p.g));
      if (selected) place(selected);
    }

    const t0 = performance.now();
    function frame(now) {
      draw((now - t0) / 1000);
      requestAnimationFrame(frame);
    }
    draw(0);
    select(planets[0]);
    if (!reduceMotion) requestAnimationFrame(frame);

    // ---------- Asteroids ----------

    // Every asteroid is always on the move along a slight arc, never parked. With
    // reduced motion they are not shown at all.
    const between = (min, max) => min + Math.random() * (max - min);

    // Keyframes for a curved trip from one point to another. The path bows out
    // towards `toward` (a corner of the screen) by 12-22% of its length, and the rock
    // turns slowly on the way. `fade` fades it in and out at the ends.
    function arc([fromX, fromY], [toX, toY], [towardX, towardY], { turn, spin, fade, width=94.26 }) {
      const top=document.querySelector(".marquee.top").getBoundingClientRect().bottom/scale;
      const bottom=document.querySelector(".marquee.bottom").getBoundingClientRect().top/scale;
      const safe=window.asteroidTravelBounds(top,bottom,width);
      const midX = (fromX + toX) / 2, midY = (fromY + toY) / 2;
      const len = Math.hypot(toX - fromX, toY - fromY);
      let nx = (toY - fromY) / len, ny = -(toX - fromX) / len;
      if (nx * (towardX - midX) + ny * (towardY - midY) < 0) { nx = -nx; ny = -ny; }
      const bend = between(.12, .22) * len;
      const ctrlX = midX + nx * bend, ctrlY = midY + ny * bend;
      const frames = [];
      for (let i = 0; i <= 24; i++) {
        const t = i / 24, u = 1 - t;
        const x = u * u * fromX + 2 * u * t * ctrlX + t * t * toX;
        const rawY = u * u * fromY + 2 * u * t * ctrlY + t * t * toY;
        const y = window.reflectAsteroidPosition(rawY,safe.min,safe.max);
        const frame = { transform: `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${(turn + spin * t).toFixed(1)}deg)` };
        if (fade) frame.opacity = Math.min(1, t / .15, (1 - t) / .15) * .9;
        frames.push(frame);
      }
      return frames;
    }

    // Little asteroids: every so often one slides in past one edge, cuts across that
    // corner of the screen and leaves past the neighbouring edge.
    let drifting = 0;

    function drift() {
      if (drifting < 2) {
        const CORNERS = [[0, 0], [ambientWidth, 0], [0, ambientHeight], [ambientWidth, ambientHeight]];
        const corner = CORNERS[Math.floor(Math.random() * CORNERS.length)];
        const [cx, cy] = corner;
        const size = between(36, 80);
        const off = size + 20;
        // Enter through the side edge, leave through the top or bottom edge, so the
        // path cuts across the corner, between 150 and 600px in from it.
        const side = [cx === 0 ? -off : ambientWidth + off - size, cy === 0 ? between(150, 600) : ambientHeight - between(150, 600)];
        const end = [cx === 0 ? between(150, 600) : ambientWidth - between(150, 600), cy === 0 ? -off : ambientHeight + off - size];
        const [from, to] = Math.random() < .5 ? [side, end] : [end, side];

        const rock = document.createElement("img");
        rock.className = "drifter";
        rock.src = "art/asteroid.png";
        rock.alt = "";
        rock.style.width = `${size}px`;
        ambient.append(rock);
        drifting++;
        const frames = arc(from, to, corner, { turn: between(0, 360), spin: between(-1, 1) * between(40, 140), fade: true, width:size });
        const cleanup=()=>{rock.remove();drifting--;};
        rock.animate(frames, { duration: between(30, 50) * 1000, easing: "linear" }).finished.then(cleanup,cleanup);
      }
      setTimeout(drift, between(8, 18) * 1000);
    }

    // The larger asteroid arcs in from the right, reflects above the lower logo
    // strip, and fades before the next trip. All paths share the logo clearance.
    const asteroid = document.querySelector(".asteroid");

    let fallDelay=null;
    function fall(from) {
      clearTimeout(fallDelay);
      const to = [between(ambientWidth * .23, ambientWidth * .88), ambientHeight + 120];
      const frames = arc(from, to, [ambientWidth, ambientHeight], { turn: 149.13, spin: between(30, 90), fade:true });
      asteroid.animate(frames, { duration: between(25, 40) * 1000, easing: "linear", fill: "forwards" }).finished.then(() => {
        fallDelay=setTimeout(() => fall([ambientWidth + 40, between(ambientHeight * .36, ambientHeight * .86)]), between(15, 45) * 1000);
      },()=>{});
    }

    if (reduceMotion) {
      asteroid.hidden = true;
    } else {
      fall([ambientWidth - 47.5, ambientHeight - 390.8]);
      setTimeout(drift, between(2, 5) * 1000);
      addEventListener("resize",()=>{
        document.querySelectorAll(".drifter").forEach(rock=>rock.getAnimations().forEach(animation=>animation.cancel()));
        asteroid.getAnimations().forEach(animation=>animation.cancel());
        fall([ambientWidth-47.5,ambientHeight*.65]);
      });
    }
  </script>
</body>
</html>
