name: Monorepo checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: pip install -r requirements-tooling.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
  launchpad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t reinvent-launchpad apps/launchpad
      - run: docker build -t reinvent-gateway apps/gateway
# No deployment. Full Fieldkit validation and the release gates in docs/DEPLOYMENT.md
# must pass before onboarding. The combined AWS/Lambda spec is currently blocked.
