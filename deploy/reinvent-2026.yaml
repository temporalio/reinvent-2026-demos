# Single Fieldkit project. NOT deployment-ready: see docs/DEPLOYMENT.md.
# Pinned platform validation: 77037f86 (temporal-fieldkit-platform main with #151:
# spec.aws for aws-lambda components; live needs the promotion that includes it).
apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: DemoProject
metadata:
  name: reinvent-2026
  annotations:
    registry.tmprl-demo.cloud/operator: v2
spec:
  registry:
    title: AWS re:Invent 2026
    summary: Portrait booth launchpad, nine themed Temporal demos, and same-origin demo routes. Initial migration;
      see deployment readiness notes.
    tags:
    - AWS
    - AI Agents
    - Durable Execution
    temporalSdks:
    - Python
    - Go
  source:
    repo: https://github.com/temporalio/reinvent-2026-demos
    branch: main
  builds:
    oncall-api:
      context: apps/agentcore-research/api
      dockerfile: apps/agentcore-research/api/Dockerfile
    oncall-agent:
      context: apps/agentcore-research/agent
      dockerfile: apps/agentcore-research/agent/Dockerfile
    launchpad:
      context: apps/launchpad
      dockerfile: apps/launchpad/Dockerfile
    gateway:
      context: apps/gateway
      dockerfile: apps/gateway/Dockerfile
    control-hub:
      context: apps/booth-control
      dockerfile: apps/booth-control/Dockerfile
    tacos-web:
      context: apps/tacos
      dockerfile: apps/tacos/docker/frontend.Dockerfile
    tacos-api:
      context: apps/tacos
      dockerfile: apps/tacos/docker/backend.Dockerfile
    tacos-worker:
      context: apps/tacos
      dockerfile: apps/tacos/docker/worker-python.Dockerfile
    banking-web:
      context: apps/money-transfer
      dockerfile: apps/money-transfer/docker/frontend.Dockerfile
    banking-api:
      context: apps/money-transfer
      dockerfile: apps/money-transfer/docker/backend.Dockerfile
    banking-worker:
      context: apps/money-transfer
      dockerfile: apps/money-transfer/docker/worker-python.Dockerfile
    pipeline:
      context: apps/data-pipeline
      dockerfile: apps/data-pipeline/Dockerfile
    travel:
      context: apps/agent-harness
      dockerfile: apps/agent-harness/Dockerfile
    flightsim:
      context: apps/flight-simulator
      dockerfile: apps/flight-simulator/Dockerfile
    photobooth:
      context: apps/photo-booth
      dockerfile: apps/photo-booth/Dockerfile
    no-roads-app:
      context: apps/no-roads
      dockerfile: apps/no-roads/demo-app/Dockerfile
    no-roads-worker:
      context: apps/no-roads
      dockerfile: apps/no-roads/lambda-worker/Dockerfile
    loan-web:
      context: apps/loan
      dockerfile: apps/loan/docker/web.Dockerfile
    loan-worker:
      context: apps/loan
      dockerfile: apps/loan/docker/lambda.Dockerfile
    sdlc:
      context: apps/agentic-sdlc
      dockerfile: apps/agentic-sdlc/docker/app.Dockerfile
  temporal:
    auth:
      mode: apiKey
    publicUI: true
    searchAttributes:
      Step:
        type: keyword
      AgenticSdlcGitHubRefs:
        type: keywordList
  secrets:
    # The platform's shared provider keys (fieldkit/platform/shared/<name>):
    # nothing to create; the booth is torn down after re:Invent.
    openai:
      shared: openai
    gemini:
      shared: gemini
    github:
      requiredProperties:
      - GITHUB_TOKEN
    email:
      requiredProperties:
      - SENDGRID_API_KEY
      - HOLODECK_EMAIL_FROM
    # Random values the operator creates on first reconcile. Copy
    # GITHUB_WEBHOOK_SECRET from Secrets Manager into the sandbox repo's
    # webhook settings when the SDLC demo is enabled.
    runtime:
      generate:
        properties:
        - name: REDIS_PASSWORD
        - name: GITHUB_WEBHOOK_SECRET
  components:
    # The launchpad gates hosted starts until Fieldkit supports aws-agentcore.
    # Keep the API ready; do not substitute an always-on/stub production worker.
    oncall-api:
      build: oncall-api
      ports:
      - name: http
        containerPort: 8080
        servicePort: 8080
      temporalAccess: true
      env:
      - name: TEMPORAL_TASK_QUEUE
        value: ri26-oncall
      - name: WORKER_LOCATION
        value: agentcore
      - name: ONCALL_EXECUTION_ENABLED
        value: 'false'
      replicas: 1
    launchpad:
      build: launchpad
      ports:
      - name: http
        containerPort: 8080
        servicePort: 8080
    gateway:
      build: gateway
      ports:
      - name: http
        containerPort: 8080
        servicePort: 8080
    # Hosted, the hub keeps its settings in the spec.aws DynamoDB table
    # (CONTROL_TABLE); without it (local runs) it uses SQLite. Ingress sends
    # /control-api straight here: reads are public for the kiosks, writes
    # need a Fieldkit sign-in (docs/STATION-CONTROL.md).
    control-hub:
      build: control-hub
      replicas: 1
      ports:
      - name: http
        containerPort: 8090
        servicePort: 8090
      env:
      - name: CONTROL_TIMEZONE
        value: America/Denver
    tacos-web:
      build: tacos-web
      ports:
      - name: http
        containerPort: 5173
        servicePort: 5173
    tacos-api:
      build: tacos-api
      ports:
      - name: http
        containerPort: 8000
        servicePort: 8000
      temporalAccess: true
      env:
      - name: TEMPORAL_TASK_QUEUE
        value: ri26-tacos
      - name: DEJAVU_WORKER_LANGUAGE
        value: python
    tacos-worker:
      build: tacos-worker
      worker: true
      env:
      - name: TEMPORAL_TASK_QUEUE
        value: ri26-tacos
      - name: DEJAVU_BACKEND_URL
        value: http://tacos-api:8000
    banking-web:
      build: banking-web
      ports:
      - name: http
        containerPort: 5173
        servicePort: 5173
    banking-api:
      build: banking-api
      ports:
      - name: http
        containerPort: 8000
        servicePort: 8000
      temporalAccess: true
      env:
      - name: TEMPORAL_TASK_QUEUE
        value: ri26-banking
    banking-worker:
      build: banking-worker
      worker: true
      env:
      - name: TEMPORAL_TASK_QUEUE
        value: ri26-banking
      - name: BANKING_BACKEND_URL
        value: http://banking-api:8000
    pipeline-web:
      build: pipeline
      ports:
      - name: http
        containerPort: 8080
        servicePort: 8080
      temporalAccess: true
      env:
      - name: TEMPORAL_TASK_QUEUE
        value: ri26-pipeline
    pipeline-worker:
      build: pipeline
      worker: true
      env:
      - name: TEMPORAL_TASK_QUEUE
        value: ri26-pipeline
      command:
      - python
      - worker.py
      replicas: 1
    travel-web:
      build: travel
      ports:
      - name: http
        containerPort: 8000
        servicePort: 8000
      env:
      # Must match travel-worker's queue: the web app starts each session's
      # workflow on it (and prefixes session IDs with it).
      - name: TEMPORAL_TASK_QUEUE
        value: ri26-travel
      - name: TRUST_AUTH_HEADERS
        value: 'false'
      args:
      - web
      temporalAccess: true
    travel-worker:
      build: travel
      worker: true
      env:
      - name: TEMPORAL_TASK_QUEUE
        value: ri26-travel
      args:
      - worker
      secrets:
      - gemini
    flightsim-web:
      build: flightsim
      ports:
      - name: http
        containerPort: 8080
        servicePort: 8080
      temporalAccess: true
      env:
      - name: TEMPORAL_TASK_QUEUE
        value: ri26-flightsim
      - name: PUBLIC_PATH
        value: /flightsim
      - name: HOLODECK_PUBLIC_BASE_URL
        value: https://reinvent-booth.tmprl-demo.cloud/flightsim
      - name: HOLODECK_STATION
        value: booth
      - name: HOLODECK_CHAOS_RATE
        value: '0'
      replicas: 1
      disruption: never
    photobooth-web:
      build: photobooth
      ports:
      - name: http
        containerPort: 8080
        servicePort: 8080
      temporalAccess: true
      env:
      - name: TEMPORAL_TASK_QUEUE
        value: ri26-photobooth
      - name: PUBLIC_PATH
        value: /photobooth
      - name: HOLODECK_PUBLIC_BASE_URL
        value: https://reinvent-booth.tmprl-demo.cloud/photobooth
      - name: HOLODECK_STATION
        value: booth
      - name: HOLODECK_CHAOS_RATE
        value: '0'
      - name: HOLODECK_IMAGE_PROVIDER
        value: openai
      - name: HOLODECK_EMAIL_PROVIDER
        value: sendgrid
      replicas: 1
      disruption: never
      secrets:
      - openai
      - email
    no-roads-web:
      build: no-roads-app
      ports:
      - name: http
        containerPort: 8080
        servicePort: 8080
      temporalAccess: true
      env:
      - name: TEMPORAL_TASK_QUEUE
        value: ri26-no-roads
      - name: TEMPORAL_WORKER_DEPLOYMENT_NAME
        value: ri26-no-roads
      - name: TEMPORAL_DEPLOYMENT_NAME
        value: ri26-no-roads
      - name: TEMPORAL_WORKER_BUILD_ID
        value: 1.0.0
    no-roads-worker:
      build: no-roads-worker
      serverless:
        provider: aws-lambda
        packageType: image
        architecture: x86_64
        memoryMb: 512
        timeoutSeconds: 600
        workerDeployment:
          deploymentName: ri26-no-roads
          buildId: 1.0.0
      env:
      - name: TEMPORAL_TASK_QUEUE
        value: ri26-no-roads
    loan-web:
      build: loan-web
      ports:
      - name: http
        containerPort: 8000
        servicePort: 8000
      temporalAccess: true
      env:
      - name: TEMPORAL_TASK_QUEUE
        value: ri26-loan
    loan-worker:
      build: loan-worker
      serverless:
        provider: aws-lambda
        packageType: image
        architecture: x86_64
        memoryMb: 2048
        timeoutSeconds: 600
        workerDeployment:
          deploymentName: ri26-loan
          buildId: build-1
      env:
      - name: TEMPORAL_TASK_QUEUE
        value: ri26-loan
      - name: TEMPORAL_WORKER_DEPLOYMENT_NAME
        value: ri26-loan
      - name: TEMPORAL_WORKER_BUILD_ID
        value: build-1
      - name: TEMPORAL_ENV
        value: cloud
    sdlc-web:
      build: sdlc
      command:
      - uvicorn
      - agentic_sdlc.web.app:app
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --root-path
      - /agentic-sdlc
      temporalAccess: true
      replicas: 1
      ports:
      - name: http
        containerPort: 8000
        servicePort: 8000
      env:
      - name: TEMPORAL_TASK_QUEUE
        value: ri26-sdlc
      - name: BASE_TASK_QUEUE
        value: ri26-sdlc
      - name: PUBLIC_URL
        value: https://reinvent-booth.tmprl-demo.cloud/agentic-sdlc
      - name: ENABLED_PROVIDERS
        value: openai
      - name: GITHUB_WEBHOOK_SECRET
        valueFrom:
          inputRef: secrets.runtime.GITHUB_WEBHOOK_SECRET
      # Booth-owned sandbox. Hosted token/webhook setup and rehearsal remain required.
      - name: GITHUB_SANDBOX_REPO
        value: temporal-aws-reinvent-2026/reinvent-sdlc-sandbox
    sdlc-worker-v1:
      build: sdlc
      command:
      - python
      - -m
      - agentic_sdlc.worker
      worker: true
      terminationGracePeriodSeconds: 600
      secrets:
      - openai
      - github
      env:
      - name: TEMPORAL_TASK_QUEUE
        value: ri26-sdlc
      - name: BASE_TASK_QUEUE
        value: ri26-sdlc
      - name: TEMPORAL_WORKER_BUILD_ID
        value: v1
      - name: PIPELINE_VERSION
        value: v1
      - name: WEB_INTERNAL_URL
        value: http://sdlc-web:8000
      # Booth-owned sandbox. Hosted token/webhook setup and rehearsal remain required.
      - name: GITHUB_SANDBOX_REPO
        value: temporal-aws-reinvent-2026/reinvent-sdlc-sandbox
      - name: RUN_BUDGET_USD
        value: '3.00'
    sdlc-worker-v2:
      build: sdlc
      command:
      - python
      - -m
      - agentic_sdlc.worker
      worker: true
      terminationGracePeriodSeconds: 600
      secrets:
      - openai
      - github
      env:
      - name: TEMPORAL_TASK_QUEUE
        value: ri26-sdlc
      - name: BASE_TASK_QUEUE
        value: ri26-sdlc
      - name: TEMPORAL_WORKER_BUILD_ID
        value: v2
      - name: PIPELINE_VERSION
        value: v2
      - name: WEB_INTERNAL_URL
        value: http://sdlc-web:8000
      # Booth-owned sandbox. Hosted token/webhook setup and rehearsal remain required.
      - name: GITHUB_SANDBOX_REPO
        value: temporal-aws-reinvent-2026/reinvent-sdlc-sandbox
      - name: RUN_BUDGET_USD
        value: '3.00'
  redis:
    version: '7'
    password: secrets.runtime.REDIS_PASSWORD
    components:
    - sdlc-web
    - sdlc-worker-v1
    - sdlc-worker-v2
  aws:
    components:
    - travel-web
    - travel-worker
    - photobooth-web
    - flightsim-web
    - loan-worker
    - control-hub
    dynamodb:
      tables:
        control:
          env: CONTROL_TABLE
          hashKey:
            name: pk
            type: S
          ttlAttribute: expires_at
    s3:
      buckets:
        # Temporal external payload storage. Photo Booth and Flight Simulator
        # keep every payload here (attendee emails stay out of the public UI);
        # Agent Harness only its large ones. Kept 30 days, past the namespace's
        # 7-day retention, so stored data can still be retrieved afterwards.
        payloads:
          env: PAYLOAD_BUCKET
          expirationDays: 30
        photos:
          env: PHOTO_MEDIA_BUCKET
          expirationDays: 30
    bedrock:
      models:
        loan:
          id: us.anthropic.claude-sonnet-5-5
          env: BEDROCK_MODEL_ID
  # Kiosks and staff need no Fieldkit session. The control hub authenticates
  # writes with its daily PIN/session cookie and enforces same-origin requests.
  ingress:
    subdomain: reinvent-booth
    auth: public
    routes:
    - pathPrefix: /agentic-sdlc/webhooks/github
      component: gateway
      port: http
      public: true
    - pathPrefix: /config
      component: gateway
      port: http
      auth: public
    - pathPrefix: /control-api/state
      component: control-hub
      port: http
    - pathPrefix: /control-api
      component: control-hub
      port: http
      auth: public
    - pathPrefix: /
      component: gateway
      port: http
  smokeCheck:
    path: /healthz
    expectedStatus: 200
    timeoutSeconds: 15
